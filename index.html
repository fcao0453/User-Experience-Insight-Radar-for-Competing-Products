<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>观微</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 布局：左侧项目栏（对话式 AI 风格）+ 右侧工作区；看板先摘要后卡片，对比页截图优先 */
:root{
  --bg:#F4F5F2; --panel:#FFFFFF; --sunk:#EBEDE8; --side:#E9ECE6;
  --line:#D9DDD4; --line-2:#C2C7BC;
  --ink:#1B201E; --ink-2:#48504C; --ink-3:#757D78;
  --accent:#2B5A86; --accent-ink:#FFFFFF; --accent-soft:#E2EAF2;
  --st-store:#8F5200; --st-store-bg:#FAEBD2;
  --st-pend:#A8381C; --st-pend-bg:#F7E1D9;
  --st-chg:#1D5A9E; --st-chg-bg:#DFE9F6;
  --st-same:#3F6550; --st-same-bg:#E1ECE4;
  --demo:#64479A; --demo-bg:#ECE6F6;
  --warn:#8A5A00; --warn-bg:#FBF1DC;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.06);
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151917; --panel:#1D2220; --sunk:#232926; --side:#1A1F1D;
  --line:#2F3632; --line-2:#3F4742;
  --ink:#E7EBE8; --ink-2:#B6BEB9; --ink-3:#88918C;
  --accent:#7FA9D6; --accent-ink:#0F1A24; --accent-soft:#22303D;
  --st-store:#F0B865; --st-store-bg:#3A2C14;
  --st-pend:#F09A80; --st-pend-bg:#3B221B;
  --st-chg:#8DB8EC; --st-chg-bg:#1E2D40;
  --st-same:#94C7A6; --st-same-bg:#1E3127;
  --demo:#BBA2E6; --demo-bg:#2C2440;
  --warn:#E9BE6B; --warn-bg:#352A14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#151917; --panel:#1D2220; --sunk:#232926; --side:#1A1F1D;
  --line:#2F3632; --line-2:#3F4742;
  --ink:#E7EBE8; --ink-2:#B6BEB9; --ink-3:#88918C;
  --accent:#7FA9D6; --accent-ink:#0F1A24; --accent-soft:#22303D;
  --st-store:#F0B865; --st-store-bg:#3A2C14;
  --st-pend:#F09A80; --st-pend-bg:#3B221B;
  --st-chg:#8DB8EC; --st-chg-bg:#1E2D40;
  --st-same:#94C7A6; --st-same-bg:#1E3127;
  --demo:#BBA2E6; --demo-bg:#2C2440;
  --warn:#E9BE6B; --warn-bg:#352A14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:0}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:22px;font-weight:700;line-height:1.35}
h2{font-size:15px;font-weight:700}
h3{font-size:14px;font-weight:500}
p{margin:0}

.app{display:grid;grid-template-columns:256px minmax(0,1fr);height:100%}
/* ---------- 侧栏 ---------- */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:14px 12px 12px}
.brand{display:flex;align-items:center;gap:8px;padding:2px 6px 12px;font-weight:700;font-size:15px}
.brand .logo{width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px}
.brand small{font-weight:400;color:var(--ink-3);font-size:11px;border:1px solid var(--line-2);border-radius:4px;padding:0 5px}
.newbtn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r);cursor:pointer;font-weight:500;text-align:left}
.newbtn:hover{border-color:var(--accent)}
.newbtn .plus{font-size:16px;line-height:1;color:var(--accent)}
.snav{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.snav a,.sproj a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none}
.snav a:hover,.sproj a:hover{background:var(--sunk);color:var(--ink)}
.snav a.on,.sproj a.on{background:var(--panel);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.sgroup{margin-top:16px;min-height:0;overflow:auto;flex:1}
.glabel{font-size:11px;letter-spacing:.08em;color:var(--ink-3);padding:4px 10px;text-transform:uppercase}
.gname{font-size:12.5px;color:var(--ink-2);padding:8px 10px 2px;font-weight:500;display:flex;align-items:center;gap:6px}
.gname::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--ink-3)}
.sproj a{padding-left:24px;font-size:13.5px}
.cnt{font-size:11px;font-family:var(--f-mono);background:var(--st-store-bg);color:var(--st-store);border-radius:10px;padding:0 7px;line-height:18px}
.sfoot{border-top:1px solid var(--line);padding-top:10px;margin-top:8px;font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:6px}
.sfoot button{background:none;border:0;padding:0;color:var(--ink-3);text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.savedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--st-same);margin-right:6px}

/* ---------- 主区 ---------- */
.main{overflow:auto;min-width:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:22px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.topbar{display:none}
.crumb{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.crumb a{color:var(--ink-3)}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.phead .q{color:var(--ink-2);margin-top:6px;max-width:68ch}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-size:13px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--ink-3);text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sec{margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sec-h .sub{color:var(--ink-3);font-size:12.5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px 16px}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}

/* 标签 */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:20px;padding:0 8px;border-radius:4px;white-space:nowrap;font-weight:500}
.tag::before{content:"";width:6px;height:6px;border-radius:1px;background:currentColor;flex:none}
.st-store{background:var(--st-store-bg);color:var(--st-store)}
.st-pend{background:var(--st-pend-bg);color:var(--st-pend)}
.st-chg{background:var(--st-chg-bg);color:var(--st-chg)}
.st-same{background:var(--st-same-bg);color:var(--st-same)}
.st-same::before{border-radius:50%}
.st-pend::before{transform:rotate(45deg)}
.demo{display:inline-flex;align-items:center;font-size:11px;line-height:18px;padding:0 6px;border-radius:4px;background:var(--demo-bg);color:var(--demo);white-space:nowrap;font-weight:500}
.sim{display:inline-flex;align-items:center;font-size:11px;line-height:18px;padding:0 6px;border-radius:4px;border:1px dashed var(--demo);color:var(--demo);white-space:nowrap;font-weight:500}
.chip{max-width:100%;display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:22px;padding:0 9px;border-radius:11px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.spec{display:inline-flex;align-items:center;font-size:11px;line-height:18px;padding:0 6px;border-radius:4px;background:var(--warn-bg);color:var(--warn);font-weight:500;white-space:nowrap}
.mark{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}

/* 过滤器 */
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.fgroup{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fgroup .lab{font-size:12px;color:var(--ink-3);margin-right:2px}
.fbtn{border:1px solid var(--line);background:transparent;border-radius:14px;padding:2px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.fbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fbtn:hover:not(.on){border-color:var(--ink-3)}

/* 首页 */
.hero{padding:40px 0 8px;max-width:760px;margin:0 auto}
.hero h1{font-size:26px;text-align:center}
.hero .lead{text-align:center;color:var(--ink-2);margin-top:6px}
.composer{margin-top:20px;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);padding:12px 12px 10px}
.composer textarea{width:100%;border:0;resize:none;background:transparent;min-height:56px;outline:none;font-size:15px;line-height:1.6}
.composer .row{justify-content:space-between}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.quick button{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.queue{display:flex;flex-direction:column}
.qrow{display:grid;grid-template-columns:28px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.3fr) auto;gap:14px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qrow .why{font-size:12.5px;color:var(--ink-2)}
.guide{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gstep{padding:12px 14px}
.gstep .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.gstep b{display:block;font-weight:500;margin:2px 0 4px}
.gstep p{font-size:12.5px;color:var(--ink-2)}

/* 看板 */
.overview{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.ov h2{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;padding:11px 14px;border-bottom:1px solid var(--line)}
.ov ul{list-style:none;margin:0;padding:4px 0;max-height:250px;overflow:auto}
.ov li{padding:7px 14px;display:flex;gap:8px;align-items:flex-start;font-size:13px}
.ov li+li{border-top:1px dashed var(--line)}
.ov li .when{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);width:44px;flex:none;padding-top:1px}
.ov .empty{padding:14px;color:var(--ink-3);font-size:12.5px}
.linkish{background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left}
.linkish:hover{color:var(--accent);text-decoration:underline}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s}
.ccard:hover{border-color:var(--ink-3)}
.ccard .top{display:flex;gap:10px;align-items:center;padding:12px 14px 10px}
.ccard .nm{font-weight:700}
.ccard .pc{font-size:12px;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kv div{padding:8px 14px}
.kv div+div{border-left:1px solid var(--line)}
.kv .k{font-size:11.5px;color:var(--ink-3)}
.kv .v{font-family:var(--f-mono);font-size:15px;font-weight:500}
.kv .d{font-size:11.5px;color:var(--ink-3)}
.srows{padding:6px 0}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:6px 14px;align-items:center}
.srow .sn{font-size:13px}
.srow .sm{grid-column:1/-1;font-size:11.5px;color:var(--ink-3)}
.ccard .foot{margin-top:auto;padding:8px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3)}

/* 模块 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.tabs button.on{border-bottom-color:var(--ink);color:var(--ink);font-weight:500}
.branchbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:12px 0}
.rv{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1.1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:12px;overflow:hidden}
.rv>div{padding:12px 14px;min-width:0}
.rv>div+div{border-left:1px solid var(--line)}
.rv .colh{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.notes dt{font-size:11.5px;color:var(--ink-3);margin-top:8px}
.notes dt:first-child{margin-top:0}
.notes dd{margin:2px 0 0;white-space:pre-wrap;font-size:13px}
.aibox{background:var(--sunk);border-radius:6px;padding:10px 12px;white-space:pre-wrap;font-size:13px}
.miss{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.miss div{font-size:12px;background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:3px 8px}
.final{border-left:3px solid var(--st-same);padding:6px 10px;background:var(--st-same-bg);border-radius:0 6px 6px 0;white-space:pre-wrap;font-size:13px;color:var(--ink)}
textarea.ed{width:100%;min-height:170px;border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;background:var(--panel);font-size:13px;line-height:1.6}
.shots{display:flex;gap:6px;flex-wrap:wrap}
.shot{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sunk);cursor:zoom-in;padding:0;display:block}
.shot img{display:block;width:100%;height:auto}
.rv .shots .shot{width:80px}
.rv .shots .shot:only-child{width:120px}

/* 档案时间线 */
.tl{position:relative;margin-left:8px}
.tl::before{content:"";position:absolute;left:84px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.tli{display:grid;grid-template-columns:76px 18px minmax(0,1fr);gap:0 0;margin-bottom:14px}
.tli .date{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);text-align:right;padding:12px 8px 0 0}
.tli .dot{width:11px;height:11px;border-radius:50%;background:var(--panel);border:2px solid var(--ink-3);margin:15px 0 0 3px;position:relative;z-index:1}
.tli.sel .dot{border-color:var(--accent);background:var(--accent)}
.tli .body{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px}
.tli.focus .body{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tli .shots .shot{width:72px}
.cond{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.cond b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.three div{font-size:12.5px;min-width:0}
.three .k{font-size:11px;color:var(--ink-3);display:flex;gap:4px;align-items:center}
.abpick{display:flex;gap:4px}
.abpick button{width:26px;height:24px;border-radius:5px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-family:var(--f-mono);font-size:12px}
.abpick button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cmpbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px}

/* 对比 */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cmpcol{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.cmpcond{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line);background:var(--sunk)}
.cmpcond div{padding:8px 12px;min-width:0}
.cmpcond div+div{border-left:1px solid var(--line)}
.cmpcond .k{font-size:11px;color:var(--ink-3)}
.cmpcond .v{font-family:var(--f-mono);font-size:13px;font-weight:500;overflow-wrap:anywhere}
.cmpcond .diff .v{color:var(--st-pend)}
.cmpshots{display:flex;gap:10px;justify-content:center;padding:16px;background:var(--panel);flex-wrap:wrap}
.cmpshots .shot{width:min(260px,100%)}
.cmpshots .shot:not(:only-child){width:min(200px,46%)}
.cmpnotes{padding:4px 16px 16px}
.ablabel{font-family:var(--f-mono);font-weight:700;background:var(--ink);color:var(--bg);border-radius:4px;padding:0 7px;font-size:12px}

/* 表单 / 弹窗 */
.field{display:flex;flex-direction:column;gap:4px}
.field label,.flabel{font-size:12px;color:var(--ink-2);font-weight:500}
.field .hint{font-size:11.5px;color:var(--ink-3)}
input[type=text],input[type=date],select,textarea.in{border:1px solid var(--line-2);border-radius:6px;padding:7px 10px;background:var(--panel);font-size:13.5px;width:100%;min-width:0}
textarea.in{min-height:70px;resize:vertical;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.check{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.tgl{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;border:1px solid var(--line-2);border-radius:14px;padding:2px 10px;cursor:pointer;background:var(--panel);user-select:none}
.tgl input{margin:0}
.tgl.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(15,20,18,.42);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:5vh max(16px,env(safe-area-inset-left,0px)) 5vh max(16px,env(safe-area-inset-right,0px))}

const pad2=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayISO=()=>iso(new Date());
const dAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const md=s=>s?s.slice(5).replace('-','.'):'';
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function bumpVer(v){const p=String(v).split('.');p[p.length-1]=String((parseInt(p[p.length-1],10)||0)+1);return p.join('.')}

// ================= 示意截图（SVG 生成） =================
function phoneSVG(spec,color){
  const W=200,H=400,X=8,Y=8,SW=184,SH=384;
  let y=Y+4, out=[], hls=[];

  const R=(x,yy,w,hh,fill,r=4,extra='')=>`<rect x="${x}" y="${yy}" width="${w}" height="${hh}" rx="${r}" fill="${fill}" ${extra}/>`;
  const navH=30, maxY=Y+SH-navH-12;
  for(const b of spec.blocks){

    const y0=y; const L=X+10, CW=SW-20;

      case 'head': out.push(R(X,y-2,SW,30,color,0), `<circle cx="${L+8}" cy="${y+12}" r="8" fill="#ffffff" opacity=".92"/>`, T(L+8,y+15,b.mark||'',8,color,'middle',700), T(L+22,y+16,b.title,9,'#fff','start',700), `<circle cx="${X+SW-18}" cy="${y+12}" r="4" fill="none" stroke="#fff" stroke-width="1.2"/>`, `<circle cx="${X+SW-32}" cy="${y+12}" r="4" fill="none" stroke="#fff" stroke-width="1.2"/>`); y+=32; break;
      case 'search': out.push(R(L,y,CW,18,'#ffffff',9,'stroke="#dfe2e6"'), T(L+10,y+12,'🔍︎ '+(b.text||'搜索功能、产品'),6.5,'#9aa0a6')); y+=24; break;
      case 'tabs': { const n=b.items.length, w=CW/n; b.items.forEach((it,i)=>{ out.push(T(L+w*i+w/2,y+12,it,7.5,i===(b.active||0)?'#111':'#888','middle',i===(b.active||0)?700:400)); if(i===(b.active||0)) out.push(R(L+w*i+w/2-8,y+16,16,2,color,1)); }); y+=24; break; }
      case 'account': out.push(R(L,y,CW,48,'#ffffff',8,'stroke="#e3e5e8"'), T(L+10,y+14,b.label||'总资产(元)',6.5,'#888'), T(L+10,y+32,b.value||'****.**',13,'#111','start',700), `<ellipse cx="${L+70}" cy="${y+11}" rx="5" ry="3" fill="none" stroke="#999" stroke-width=".9"/>`, T(L+CW-10,y+30,b.right||'资产 ›',7,color,'end',700)); if(b.sub) out.push(T(L+10,y+43,b.sub,5.8,'#999')); y+=54; break;
      case 'ai': out.push(R(L,y,CW,20,bgSoft,10), T(L+10,y+13,'✦ '+(b.text||'AI 助手'),7,color,'start',700), T(L+CW-10,y+13,'问一问 ›',6.5,'#777','end')); y+=26; break;
      case 'grid': { const cols=b.cols||5, n=b.n||10, rows=Math.ceil(n/cols), cw=CW/cols; for(let i=0;i<n;i++){const cx=L+cw*(i%cols)+cw/2, cy=y+Math.floor(i/cols)*30+10; out.push(`<rect x="${cx-8}" y="${cy-8}" width="16" height="16" rx="5" fill="${i%3===0?color:bgSoft}" opacity="${i%3===0?.85:1}"/>`, R(cx-9,cy+12,18,3,'#cfd3d8',1.5));} y+=rows*30+4; break; }
      case 'banner': out.push(R(L,y,CW,b.h||38,b.dark?color:bgSoft,8), T(L+12,y+16,b.text||'活动运营位',8,b.dark?'#fff':color,'start',700), T(L+12,y+28,b.sub||'限时 · 演示素材',6,b.dark?'#ffffffcc':'#888')); y+=(b.h||38)+6; break;
      case 'section': out.push(T(L,y+10,b.title,8,'#111','start',700), T(L+CW,y+10,'更多 ›',6.2,'#999','end')); y+=16; break;
      case 'feed': for(let i=0;i<(b.n||2);i++){ out.push(R(L,y,CW,30,'#ffffff',6,'stroke="#e6e8eb"'), R(L+8,y+7,16,16,bgSoft,4), R(L+30,y+8,CW*0.5,4,'#c9cdd2',2), R(L+30,y+17,CW*0.32,3.5,'#dde0e4',2)); y+=35;} break;
      case 'reco': out.push(R(L,y,CW,b.h||58,'#ffffff',8,'stroke="#e6e8eb"'), T(L+10,y+13,b.text||'为你推荐',7.5,'#111','start',700), T(L+CW-10,y+13,b.tag||'',6,color,'end')); for(let i=0;i<2;i++){out.push(R(L+10,y+20+i*17,CW*0.42,4,'#c9cdd2',2), T(L+CW-10,y+26+i*17,i?'3.10%':'2.85%',7.5,'#d13b2f','end',700));} y+=(b.h||58)+6; break;
      case 'list': (b.rows||[]).forEach(r=>{ out.push(R(L,y,CW,20,'#ffffff',0), T(L+6,y+13,r[0],7,'#333'), T(L+CW-6,y+13,r[1],7,'#111','end',700), R(L,y+20,CW,.6,'#e5e7ea',0)); y+=21;}); y+=6; break;
      case 'cards': (b.items||[]).forEach((c,i)=>{ out.push(R(L,y,CW,34,i===0?color:(i===1?'#2f3b4a':'#5b6b78'),7), T(L+10,y+14,c[0],7.5,'#fff','start',700), T(L+10,y+26,c[1],6.5,'#ffffffcc')); y+=38;}); break;
      case 'chips': { let x=L; (b.items||[]).forEach(c=>{const w=c.length*7+14; out.push(R(x,y,w,16,'#fff',8,'stroke="#e1e4e8"'), T(x+w/2,y+11,c,6.5,'#555','middle')); x+=w+5;}); y+=22; break; }
      case 'gap': y+=b.h||8; break;
    }
    if(b.hl) hls.push({y0:y0-2,y1:y-3,n:b.hl});
  }
  hls.forEach(o=>{ out.push(`<rect x="${X+4}" y="${o.y0}" width="${SW-8}" height="${Math.max(10,o.y1-o.y0)}" rx="6" fill="none" stroke="#E8590C" stroke-width="1.6" stroke-dasharray="4 3"/>`, `<circle cx="${X+SW-8}" cy="${o.y0+2}" r="7" fill="#E8590C"/>`, T(X+SW-8,o.y0+5,String(o.n),8,'#fff','middle',700)); });
  const nav=spec.nav||['首页','财富','生活','我的'];
  const ny=Y+SH-navH; out.push(R(X,ny,SW,navH,'#ffffff',0), R(X,ny,SW,.7,'#e2e4e7',0));

}
const svgCache={};
function shotSrc(shot,app){
  if(shot.kind==='img') return shot.src;
  const key=(app?app.id:'')+JSON.stringify(shot.spec);
  if(!svgCache[key]) svgCache[key]='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(phoneSVG(shot.spec,app?app.color:'#555'));
  return svgCache[key];
}

const DIM_RULES=[[/入口|按钮|跳转|文案|路径|›/,'入口位置'],[/AI|助手|智能/,'AI 融入方式'],[/推荐|个性化|千人千面|持仓|客群/,'个性化推荐'],[/banner|运营|活动|专区/,'运营位密度'],[/宫格|模块|首屏|顺序|分栏|分层|下沉|下移|层级|信息流/,'信息层级'],[/卡包|借记卡|信用卡|钱包/,'卡片分组'],[/快捷/,'快捷操作']];
function guessDim(t){for(const [re,d] of DIM_RULES) if(re.test(t)) return d; return '其他'}
function splitSent(t){return String(t||'').split(/[；;。\n]/).map(s=>s.trim()).filter(Boolean)}
function originalText(r){
  return `观察到的变化：${r.noChange?'（复查后未发现明显变化）':''}${r.changes||'—'}\n使用感受：${r.feeling||'—'}\n可能原因${r.causeSpec?'（推测）':''}：${r.cause||'—'}`;
}
function aiSuggest(r,p,st){
  st=st||S; const app=st.apps.find(a=>a.id===r.app); const sc=(st.scenes.find(s=>s.id===r.scene)||{}).name||r.scene;
  const parts=splitSent(r.changes);
  const bullets=r.noChange?['· [无变化] '+(parts[0]||'复查未发现明显变化')]:parts.map(s=>`· [${guessDim(s)}] ${s}`);
  const lead=r.noChange?`与上一版本一致，未发现明显变化（${app.name} ${r.version} · ${sc}）。`:`${parts[0]||'—'}${parts.length>1?`，另有 ${parts.length-1} 处变化`:''}（${app.name} ${r.version} · ${r.platform} · ${sc}）。`;
  const feel=splitSent(r.feeling).join('；');
  const hasCause=r.cause&&!/^（?暂无）?$/.test(r.cause.trim());
  let text=`结论：${lead}\n观察到的变化：\n${bullets.join('\n')}\n使用感受：${feel||'—'}`;
  if(hasCause) text+=`\n可能原因（推测）：${r.cause.replace(/^（推测）/,'')}`;
  const miss=[];
  const sameScene=st.records.filter(x=>x.app===r.app&&x.scene===r.scene&&x.id!==r.id&&x.date<=r.date);
  if(!r.shots||!r.shots.length) miss.push('缺少截图证据：结论无法回看，建议补传截图');
  if(!sameScene.length) miss.push(r.noChange?'标为“无变化”，但档案中没有同场景的上一版本记录可对照':'档案中没有同场景的更早记录，无法确认“变化”是相对哪一版');
  if(hasCause&&r.causeSpec) miss.push('“可能原因”缺少版本说明、公告或报道等依据，保留推测标记');
  if(!r.channel) miss.push('未记录下载渠道');
  if(r.shots&&r.shots.length===1&&r.scene==='asset') miss.push('资产入口场景只有一张图，建议补一张点击后的落地页');
  const dims=[...new Set(parts.map(guessDim))].filter(d=>d!=='其他');
  return {text,miss,dims,spec:hasCause,at:todayISO()};
}

const byDate=(x,y)=>(y.date>x.date?1:y.date<x.date?-1:cmpVer(y.version,x.version));
const STATUS={store:{label:'商店有新版本',cls:'st-store',rank:0},pend:{label:'场景待复查',cls:'st-pend',rank:1},chg:{label:'已复查，有变化',cls:'st-chg',rank:2},same:{label:'已复查，无明显变化',cls:'st-same',rank:3}};
const tag=k=>`<span class="tag ${STATUS[k].cls}">${STATUS[k].label}</span>`;
const DEMO='<span class="demo">演示数据</span>';
const SIM='<span class="sim">模拟 AI · 非真实模型</span>';
function activeRecs(p,appId,scene){return p.refs.filter(f=>f.active&&f.scene===scene).map(f=>REC(f.rid)).filter(r=>r&&r.app===appId).sort(byDate)}
function projScenes(p,appId){const e=p.apps.find(a=>a.id===appId);return e?e.scenes.filter(s=>p.scenes.includes(s)):[]}
function statusOf(p,appId,scene){
  const recs=activeRecs(p,appId,scene), latest=recs[0], sv=storeLatest(APP(appId)), k=appId+'|'+scene;
  const mk=(key,reason)=>({key,reason,latest,...STATUS[key]});
  if(!latest) return mk('pend',p.gaps[k]?'需补采：本项目该场景尚无适用记录':'尚无适用记录');
  if(sv&&cmpVer(sv.v,latest.version)>0) return mk('store',`商店 ${sv.v}（${md(sv.d)}）新于实测 ${latest.version}`);
  if(p.flags[k]) return mk('pend',p.flags[k].note);
  return latest.noChange?mk('same',`${latest.version} 于 ${md(latest.date)} 复查，未见明显变化`):mk('chg',`${latest.version} 于 ${md(latest.date)} 复查，记录了变化`);
}
function pairs(p){const out=[];for(const a of p.apps){if(!APP(a.id))continue;for(const s of projScenes(p,a.id))out.push({app:a.id,scene:s,st:statusOf(p,a.id,s)})}return out}
const needCount=p=>pairs(p).filter(x=>x.st.key==='store'||x.st.key==='pend').length;
function shotsHTML(r,n){const a=APP(r.app);const list=(r.shots||[]).slice(0,n||9);if(!list.length)return '<div class="tiny muted">无截图</div>';return `<div class="shots">${list.map((s,i)=>`<button class="shot" data-act="img" data-rid="${r.id}" data-i="${i}" aria-label="放大截图"><img alt="${h(a.name+' '+r.version+' 截图'+(i+1))}" src="${shotSrc(s,a)}" loading="lazy"></button>`).join('')}</div>`}
function markHTML(a,size){return `<span class="mark" style="background:${a.color}${size?`;width:${size}px;height:${size}px`:''}">${h(a.mark)}</span>`}
function toast(msg){UI.toast=msg;renderToast();clearTimeout(UI._tt);UI._tt=setTimeout(()=>{UI.toast=null;renderToast()},3200)}
function renderToast(){let el=document.getElementById('toast');el.innerHTML=UI.toast?`<div class="toast" role="status">${h(UI.toast)}</div>`:''}

function reviewRow(p,r,prev){
  const a=APP(r.app), rv=p.reviews[r.id], ed=UI.editing[p.id+'|'+r.id];

  let ai;

  else { const lab={kept:'保留原文',adopted:'采纳建议',edited:'编辑后采纳'}[rv.state];

  return `<div class="rv" id="rv-${r.id}">
   <div><div class="colh">截图证据</div>${shotsHTML(r)}<div class="cond" style="margin-top:8px;flex-direction:column;gap:2px"><span>版本 <b>${h(r.version)}</b></span><span>${h(r.platform)} · ${h(r.channel||'未记录渠道')}</span><span>采集 <b>${h(r.date)}</b></span></div><div class="row" style="margin-top:6px">${r.noChange?'<span class="tag st-same">复查无变化</span>':''}${r.demo?DEMO:''}</div></div>
   <div><div class="colh">研究员原文 <span class="chip" style="line-height:18px">原始记录${r.edited?` · 已编辑 ${md(r.edited)}`:''}</span></div><dl class="notes"><dt>观察到的变化</dt><dd>${r.noChange?'<b>复查后未发现明显变化。</b>':''}${h(r.changes||'—')}</dd><dt>使用感受</dt><dd>${h(r.feeling||'—')}</dd><dt>可能原因 ${hasCause&&r.causeSpec?'<span class="spec">推测</span>':''}</dt><dd>${h(r.cause||'—')}</dd></dl><div class="row small" style="margin-top:8px"><span class="muted">${h(r.author||'')}</span><a href="#archive-${r.app}" data-act="go" data-to="archive-${r.app}" data-focus="${r.id}">在档案中查看</a>${prev?`<a href="#compare-${r.app}" data-act="cmp-pair" data-app="${r.app}" data-a="${prev.id}" data-b="${r.id}">与 ${h(prev.version)} 并排对比</a>`:''}</div></div>
   <div>${ai}</div></div>`;
}

function viewCompare(a){

  const warn=[];if(A&&B){if(A.scene!==B.scene)warn.push('两次采集的业务场景不同，对比结论需谨慎');if(A.platform!==B.platform)warn.push('平台不同（'+A.platform+' / '+B.platform+'），差异可能来自平台而非版本');}
  return `<div class="wrap"><div class="crumb"><a href="#home">首页</a>/<a href="#archive">竞品档案</a>/<a href="#archive-${a.id}">${h(a.name)}</a>/<span>版本对比</span></div>

  ${A&&B?`<div class="note ${warn.length?'warn':''}" style="margin-bottom:12px">${A.scene===B.scene?`同一业务场景「${h(SC(A.scene))}」`:'跨场景'} · 版本 <span class="mono">${h(A.version)} → ${h(B.version)}</span> · 间隔 ${Math.abs(daysBetween(A.date,B.date))} 天${warn.length?' · '+warn.map(h).join('；'):''}</div>`:''}
  <div class="cmp">${col('A',A,B)}${col('B',B,A)}</div></div>`;
}

// ================= 重新选择适用记录 =================
function rescopeDraft(p){
  if(UI.rescope[p.id]) return UI.rescope[p.id];
  const map={},add={},gaps={};
  p.refs.forEach(f=>{map[f.rid]=(f.active&&p.scenes.includes(f.scene))?f.scene:''});
  return UI.rescope[p.id]={map,add,gaps};
}
function coverage(p,D){const cov={};const put=(rid,s)=>{if(!s)return;const r=REC(rid);if(!r)return;const k=r.app+'|'+s;cov[k]=(cov[k]||0)+1};Object.entries(D.map).forEach(([rid,s])=>put(rid,s));Object.entries(D.add).forEach(([rid,s])=>put(rid,s));return cov}
function viewRescope(p){
  const D=rescopeDraft(p); const last=p.history[p.history.length-1]; const cov=coverage(p,D);
  const appIds=p.apps.map(e=>e.id); const refIds=p.refs.map(f=>f.rid);
  const others=S.records.filter(r=>appIds.includes(r.app)&&!refIds.includes(r.id)).sort(byDate);
  const sel=(rid,val,bind)=>`<select data-on="rs-map" data-pid="${p.id}" data-rid="${rid}" data-kind="${bind}" aria-label="在新范围中用于"><option value="">${bind==='map'?'不适用（保留在先前引用）':'不引用'}</option>${p.scenes.map(s=>`<option value="${s}" ${val===s?'selected':''}>用于：${h(SC(s))}</option>`).join('')}</select>`;
  const row=(r,val,bind,f)=>{const a=APP(r.app);return `<tr><td style="width:56px">${r.shots&&r.shots[0]?`<button class="shot" style="width:40px" data-act="img" data-rid="${r.id}" data-i="0"><img alt="" src="${shotSrc(r.shots[0],a)}"></button>`:''}</td><td><b>${h(a.name)}</b><div class="tiny muted">${h(SC(r.scene))} · <span class="mono">${h(r.version)}</span> · ${md(r.date)}</div></td><td class="small" style="max-width:360px">${h((r.changes||'').slice(0,64))}${(r.changes||'').length>64?'…':''}${f?`<div class="tiny muted">原引用于：${h(SC(f.scene))}${f.active?'':'（已在范围外）'}</div>`:''}</td><td>${sel(r.id,val,bind)}</td><td><a class="small" href="#archive-${r.app}" data-act="go" data-to="archive-${r.app}" data-focus="${r.id}">档案</a></td></tr>`};
  return `<div class="wrap"><div class="crumb"><a href="#home">首页</a>/<a href="#project-${p.id}">${h(p.group)}-${h(p.name)}</a>/<span>重新选择适用记录</span></div>
  <div class="phead"><div><h1>重新选择适用记录</h1><p class="q">当前研究问题：${h(p.question)}</p></div><div class="acts"><button class="btn" data-act="go" data-to="project-${p.id}">返回看板</button><button class="btn pri" data-act="rescope-save" data-pid="${p.id}">应用引用调整</button></div></div>
  ${last?`<div class="panel pad small stack" style="margin-bottom:12px"><b>研究问题修改记录</b><div class="hist">${p.history.slice().reverse().map(x=>`<div><span class="mono">${h(x.at)}</span> 原问题：「${h(x.question)}」 · 原场景：${x.scenes.map(SC).map(h).join('、')}</div>`).join('')}</div></div>`:''}
  <div class="note" style="margin-bottom:14px">这里只调整本项目的引用。档案中的截图与笔记保持原样，其他项目对同一记录的引用不受影响。</div>
  <section class="sec"><div class="sec-h"><h2>先前引用的材料 <span class="muted small">${p.refs.length} 条</span></h2><span class="sub">选择它在新范围里对应的场景，或设为不适用</span></div>
  <div class="panel scroll-x"><table class="mx"><thead><tr><th>截图</th><th>App / 原记录</th><th>笔记摘要</th><th>在新范围中</th><th></th></tr></thead><tbody>${p.refs.filter(f=>REC(f.rid)).map(f=>row(REC(f.rid),D.map[f.rid],'map',f)).join('')}</tbody></table></div></section>
  <section class="sec"><div class="sec-h"><h2>档案中可引用的其他记录 <span class="muted small">${others.length} 条</span></h2><span class="sub">来自本项目竞品的历史记录，也包括其他项目登记的</span></div>
  <div class="panel scroll-x">${others.length?`<table class="mx"><thead><tr><th>截图</th><th>App / 原记录</th><th>笔记摘要</th><th>引用为</th><th></th></tr></thead><tbody>${others.map(r=>row(r,D.add[r.id]||'','add')).join('')}</tbody></table>`:'<div class="pad muted small">没有其他可引用的记录。</div>'}</div></section>
  <section class="sec"><div class="sec-h"><h2>场景覆盖与补采</h2><span class="sub">没有适用记录的场景，建议标记为需补采</span></div>
  <div class="panel scroll-x"><table class="mx"><thead><tr><th>竞品</th>${p.scenes.map(s=>`<th>${h(SC(s))}</th>`).join('')}</tr></thead><tbody>${p.apps.map(e=>`<tr><td>${h(APP(e.id).name)}</td>${p.scenes.map(s=>{const k=e.id+'|'+s;if(!e.scenes.includes(s))return '<td class="muted small">未调查</td>';const n=cov[k]||0;const g=D.gaps[k]!==undefined?D.gaps[k]:true;return `<td>${n?`<span class="tag st-same">已覆盖 ${n} 条</span>`:`<label class="tgl ${g?'on':''}"><input type="checkbox" data-act="rs-gap" data-pid="${p.id}" data-k="${k}" ${g?'checked':''}>标记需补采</label>`}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></section>
  </div>`;
}

    <div class="grid3"><div class="field"><label for="rf-app">App</label><select id="rf-app" data-bind="modal.d.app" data-rerender="1">${S.apps.map(x=>`<option value="${x.id}" ${x.id===D.app?'selected':''}>${h(x.name)}</option>`).join('')}</select></div>

  if(M.type==='store'){const D=M.d;return wrap('登记商店更新（模拟）',`<div class="note">第一版不接真实商店接口。在这里手动登记你在商店看到的新版本，或用“填入模拟版本”生成一条演示更新。</div>

function parseScenes(t){return [...new Set(String(t||'').split(/[、,，;；\n]+/).map(x=>x.trim()).filter(Boolean))]}

function wizApps(){const W=UI.wiz;const src=PROJ(W.source);if(!src)return [];return src.apps.filter(e=>APP(e.id)&&W.apps[e.id]!==false).map(e=>e.id)}
function wizPreview(){const W=UI.wiz,out={};if(!W)return out;const names=parseScenes(W.sceneText);for(const id of wizApps())for(const n of names){const sc=S.scenes.find(x=>x.name===n);const r=sc?S.records.filter(x=>x.app===id&&x.scene===sc.id).sort(byDate)[0]:null;out[id+'|'+n]=r||null}return out}
function wizSummary(){const W=UI.wiz;if(!W.source)return '不复用竞品：创建后可在「编辑项目范围」中添加';const v=Object.values(wizPreview());const reuse=v.filter(Boolean).length;return `${wizApps().length} 款竞品 · 将复用 ${W.reuse?reuse:0} 条记录 · ${W.reuse?v.length-reuse:v.length} 个场景需补采`}
function openWizard(preset){
  UI.wiz=Object.assign({group:'银行产品',name:'',role:(S.projects[0]||{}).role||'',question:'',sceneText:'',dims:'',source:'',apps:{},reuse:true,addingTag:false,newTag:''},preset||{});
  UI.modal={type:'wiz'}; renderModal();

function comboOpts(){return [{v:'',l:'不使用'},...S.projects.map(p=>({v:p.id,l:srcLabel(p.id)}))]}
function setupCombo(inp){
  const list=document.getElementById('wz-src-list');let act=0;
  const show=q=>{const all=comboOpts();const ql=(q||'').trim().toLowerCase();const m=(!ql||q===srcLabel(UI.wiz.source))?all:all.filter(o=>o.l.toLowerCase().includes(ql));
    act=Math.max(0,Math.min(act,m.length-1));
    list.innerHTML=m.length?m.map((o,i)=>`<li role="option" id="wz-opt-${i}" data-v="${o.v}" class="${o.v===UI.wiz.source?'cur':''} ${i===act?'act':''}" aria-selected="${o.v===UI.wiz.source}">${h(o.l)}</li>`).join(''):'<li class="none">没有匹配的项目</li>';
    list.hidden=false;inp.setAttribute('aria-expanded','true');list._m=m};
  const pick=v=>{UI.wiz.source=v;UI.wiz.apps={};UI.modal.err=null;renderModal()};
  inp.addEventListener('focus',()=>{act=0;inp.select();show('')});
  inp.addEventListener('input',()=>{act=0;show(inp.value)});
  inp.addEventListener('keydown',e=>{if(list.hidden)return;const m=list._m||[];
    if(e.key==='ArrowDown'){e.preventDefault();act=Math.min(act+1,m.length-1);show(inp.value)}
    else if(e.key==='ArrowUp'){e.preventDefault();act=Math.max(act-1,0);show(inp.value)}
    else if(e.key==='Enter'){e.preventDefault();if(m[act])pick(m[act].v)}
    else if(e.key==='Escape'){e.stopPropagation();list.hidden=true;inp.value=srcLabel(UI.wiz.source)}});
  inp.addEventListener('blur',()=>setTimeout(()=>{if(!document.body.contains(list))return;list.hidden=true;inp.setAttribute('aria-expanded','false');inp.value=srcLabel(UI.wiz.source)},150));
  list.addEventListener('mousedown',e=>{e.preventDefault();const li=e.target.closest('li[data-v]');if(li)pick(li.dataset.v)});
}

function render(){
  const R=route(); const side=document.getElementById('side'); side.innerHTML=sidebar(R); side.classList.toggle('open',UI.sideOpen);
  let html='';
  try{
    const p=R.a&&PROJ(R.a);
    if(R.v==='home') html=viewHome();
    else if(R.v==='archive'&&!R.a) html=viewArchiveIndex();
    else if(R.v==='archive'&&APP(R.a)) html=viewArchive(APP(R.a));
    else if(R.v==='compare'&&APP(R.a)) html=viewCompare(APP(R.a));
    else if(R.v==='project'&&p) html=viewProject(p);
    else if(R.v==='module'&&p&&APP(R.b)){p.seen=p.seen||{};const sv=storeLatest(APP(R.b));if(p.seen[R.b]!==sv.v){p.seen[R.b]=sv.v;save(true);side.innerHTML=sidebar(R)}html=viewModule(p,APP(R.b))}
    else if(R.v==='scope'&&p) html=viewScope(p);
    else if(R.v==='rescope'&&p) html=viewRescope(p);
    else if(R.v==='findings'&&p) html=viewFindings(p);
    else if(R.v==='finding'&&p&&p.findings.find(f=>f.id===R.b)) html=viewFinding(p,p.findings.find(f=>f.id===R.b));
    else html=`<div class="wrap"><div class="panel pad">没有找到这个页面。<a href="#home">回到首页</a></div></div>`;
  }catch(err){console.error(err);html=`<div class="wrap"><div class="note warn">页面渲染出错：${h(err.message)}</div></div>`}
  const main=document.getElementById('main'); main.innerHTML=`<div class="topbar"><button class="btn sm" data-act="side">☰ 项目</button><b>观微</b></div>`+html;
  if(UI.lastRoute!==R.raw){main.scrollTop=0;window.scrollTo(0,0);UI.lastRoute=R.raw}
  if(UI.focus&&UI.focusDone!==UI.focus+R.raw){const el=document.getElementById('tl-'+UI.focus)||document.getElementById('rv-'+UI.focus);if(el){el.scrollIntoView({block:'center'});UI.focusDone=UI.focus+R.raw}}
  renderModal();
}
function renderModal(){document.getElementById('modal').innerHTML=modalHTML();const ci=document.getElementById('wz-src-in');if(ci)setupCombo(ci);const d=document.getElementById('drop');if(d){['dragover','dragenter'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over')}));['dragleave','drop'].forEach(ev=>d.addEventListener(ev,()=>d.classList.remove('over')));d.addEventListener('drop',e=>{e.preventDefault();addFiles(e.dataTransfer.files)})}}

function setPath(path,val){const ks=path.split('.');let o=UI;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=val}
function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,480/img.width,2000/img.height);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function addFiles(files){if(!UI.modal||UI.modal.type!=='record')return;for(const f of files){if(!/^image\//.test(f.type))continue;try{UI.modal.d.shots.push({kind:'img',src:await compress(f)})}catch(e){toast('有一张图片无法读取，已跳过')}}renderModal()}

function addRef(p,rid,scene,via){const f=p.refs.find(x=>x.rid===rid);if(f){f.scene=scene;f.active=true}else p.refs.push({rid,scene,active:true,added:todayISO(),via:via||''});const r=REC(rid);delete p.gaps[r.app+'|'+scene]}

      S.projects.forEach(p=>{if(p.reviews[r.id])p.reviews[r.id].stale=true});

    const r={id:uid('r'),app:D.app,scene:D.scene,version:D.version,platform:D.platform,channel:D.channel.trim(),date:D.date,shots:D.shots,changes:D.changes.trim()||(D.noChange?'复查后未发现明显变化。':''),feeling:D.feeling.trim(),cause:D.cause.trim(),causeSpec:!!D.causeSpec&&!!D.cause.trim(),noChange:!!D.noChange,author:D.author||'研究员',demo:false,created:todayISO()};
    S.records.push(r);let msg='已保存到竞品档案';
    if(M.pid){const p=PROJ(M.pid);const e=p.apps.find(x=>x.id===r.app);if(e&&!e.scenes.includes(r.scene))e.scenes.push(r.scene);if(p.scenes.includes(r.scene)){addRef(p,r.id,r.scene);delete p.flags[r.app+'|'+r.scene];const st=statusOf(p,r.app,r.scene);msg=`已保存并引用到本项目 · ${SC(r.scene)}状态：${st.label}`;UI.branch[p.id+'|'+r.app]=r.scene;UI.focus=r.id}}
    else UI.focus=r.id;
    save();UI.modal=null;render();toast(msg)},
  'store-form'(t){const a=APP(t.dataset.app)||S.apps[0];UI.modal={type:'store',d:{app:a.id,v:'',d:todayISO(),note:'',sim:false}};renderModal()},

  'sf-save'(){const M=UI.modal,D=M.d;const a=APP(D.app);D.v=(D.v||'').trim();if(!D.v){M.err='请填写版本号，或点“填入模拟版本”。';return renderModal()}if(a.store.some(s=>s.v===D.v)){M.err='该版本已登记过。';return renderModal()}

  'ai-run'(t){const p=PROJ(t.dataset.pid);const recs=activeRecs(p,t.dataset.app,t.dataset.scene);let n=0;recs.forEach(r=>{if(!p.reviews[r.id]){p.reviews[r.id]={sug:aiSuggest(r,p),state:'pending'};n++}});save();render();toast(n?`模拟 AI 已整理 ${n} 条记录，请逐条审阅`:'这些记录都已整理过')},

  'rv-adopt'(t){const p=PROJ(t.dataset.pid),rv=p.reviews[t.dataset.rid];delete rv.stale;rv.state='adopted';rv.final=rv.sug.text;rv.at=todayISO();save();render();toast('已采纳建议，原始记录保持不变')},
  'rv-edit'(t){const p=PROJ(t.dataset.pid);UI.editing[p.id+'|'+t.dataset.rid]=p.reviews[t.dataset.rid].sug.text;render();const el=document.getElementById('ed-'+t.dataset.rid);el&&el.focus()},

  'rv-reset'(t){const p=PROJ(t.dataset.pid);const rv=p.reviews[t.dataset.rid];rv.state='pending';delete rv.final;rv.sug=aiSuggest(REC(t.dataset.rid),p);delete rv.stale;delete rv.demo;save();render()},
  'finding-new'(t){const p=PROJ(t.dataset.pid);const rid=t.dataset.rid;let title='',body='';if(rid){const rv=p.reviews[rid];const r=REC(rid);const first=(rv.final||'').split('\n')[0].replace(/^结论[^：]*：/,'');title=`${APP(r.app).name}：${first.slice(0,30)}`;body=first}

  'fd-save'(){const M=UI.modal,D=M.d,p=PROJ(M.pid);const apps=[...new Set(D.rids.map(id=>REC(id).app))];
    if(!D.title.trim()){M.err='请填写发现标题。';return renderModal()}if(!D.rids.length){M.err='至少选择一条已审核记录作为证据。';return renderModal()}if(D.type==='trend'&&apps.length<2){M.err='跨产品趋势需要至少 2 款 App 的证据。';return renderModal()}
    const f={id:uid('f'),type:D.type,status:D.confirm?'confirmed':'candidate',title:D.title.trim(),body:D.body.trim(),rids:D.rids.slice(),apps,scene:REC(D.rids[0]).scene,created:todayISO(),confirmed:D.confirm?todayISO():null};
    p.findings.unshift(f);save();UI.modal=null;UI.newFinding=f.id;go('findings-'+p.id);toast(D.confirm?'发现已确认并加入项目汇总':'已作为候选加入项目汇总')},

  img(t){UI.modal={type:'img',rid:t.dataset.rid,i:+t.dataset.i};renderModal()},

  'scope-scene'(t){const D=UI.scope[t.dataset.pid];const s=t.dataset.scene;const i=D.scenes.indexOf(s);if(i>=0)D.scenes.splice(i,1);else{D.scenes.push(s);D.apps.forEach(e=>{if(!e.scenes.includes(s))e.scenes.push(s)})}render()},
  'scope-add-scene'(t){const D=UI.scope[t.dataset.pid];const n=(D.newScene||'').trim();if(!n)return toast('请先输入场景名称');let s=S.scenes.find(x=>x.name===n);if(!s){s={id:'sc'+Date.now().toString(36),name:n,desc:''};S.scenes.push(s);save()}if(!D.scenes.includes(s.id)){D.scenes.push(s.id);D.apps.forEach(e=>e.scenes.push(s.id))}D.newScene='';render()},
  'scope-cell'(t){const e=UI.scope[t.dataset.pid].apps.find(x=>x.id===t.dataset.app);const i=e.scenes.indexOf(t.dataset.scene);if(i>=0)e.scenes.splice(i,1);else e.scenes.push(t.dataset.scene)},
  'scope-rm-app'(t){const D=UI.scope[t.dataset.pid];D.apps=D.apps.filter(e=>e.id!==t.dataset.app);render()},
  'scope-cancel'(t){delete UI.scope[t.dataset.pid];go('project-'+t.dataset.pid)},
  'scope-save'(t){const p=PROJ(t.dataset.pid),D=UI.scope[p.id];if(!D.question.trim())return toast('研究问题不能为空');if(!D.scenes.length)return toast('至少保留一个业务场景');
    const changed=D.question.trim()!==p.question||D.scenes.slice().sort().join()!==p.scenes.slice().sort().join();
    if(changed)p.history.push({at:todayISO(),question:p.question,scenes:p.scenes.slice()});
    Object.assign(p,{group:D.group.trim()||p.group,name:D.name.trim()||p.name,role:D.role.trim(),question:D.question.trim(),scenes:D.scenes.slice(),dims:D.dims.split(/[,，、]/).map(s=>s.trim()).filter(Boolean),apps:D.apps.map(e=>({id:e.id,scenes:e.scenes.slice()}))});
    // 不在范围内的引用标为范围外，但保留
    p.refs.forEach(f=>{if(!p.scenes.includes(f.scene))f.active=false});
    delete UI.scope[p.id];delete UI.rescope[p.id];save();
    if(changed){go('rescope-'+p.id);toast('研究范围已更新：请重新选择适用记录，先前引用的材料都还在')}else{go('project-'+p.id);toast('项目范围已保存')}},
  'rs-gap'(t){const D=UI.rescope[t.dataset.pid];D.gaps[t.dataset.k]=t.checked;render()},
  'rescope-save'(t){const p=PROJ(t.dataset.pid),D=rescopeDraft(p);
    p.refs.forEach(f=>{const v=D.map[f.rid];if(v){f.scene=v;f.active=true}else f.active=false});
    Object.entries(D.add).forEach(([rid,s])=>{if(s)p.refs.push({rid,scene:s,active:true,added:todayISO(),via:'rescope'})});
    const cov=coverage(p,D);p.gaps={};p.apps.forEach(e=>projScenes(p,e.id).forEach(s=>{const k=e.id+'|'+s;if(!cov[k]&&(D.gaps[k]!==undefined?D.gaps[k]:true))p.gaps[k]=true}));
    delete UI.rescope[p.id];save();go('project-'+p.id);toast(`引用已调整：${p.refs.filter(f=>f.active).length} 条适用，${p.refs.filter(f=>!f.active).length} 条保留在先前引用，${Object.keys(p.gaps).length} 个场景需补采`)},
  'wz-tag-add'(t){const W=UI.wiz;const n=S.sceneTags[+t.dataset.i];const cur=parseScenes(W.sceneText);if(!cur.includes(n))cur.push(n);W.sceneText=cur.join('、');renderModal()},
  'wz-tag-del'(t){const W=UI.wiz;const i=+t.dataset.i;const n=S.sceneTags[i];S.sceneTags.splice(i,1);W.sceneText=parseScenes(W.sceneText).filter(x=>x!==n).join('、');save();renderModal();toast(`已删除场景标签「${n}」，档案里的记录不受影响`)},
  'wz-tag-new'(){UI.wiz.addingTag=true;UI.wiz.newTag='';renderModal();const el=document.getElementById('wz-newtag');el&&el.focus()},
  'wz-tag-cancel'(){UI.wiz.addingTag=false;renderModal()},
  'wz-tag-save'(){const W=UI.wiz;const n=(W.newTag||'').trim();if(!n)return toast('请输入场景名称');if(S.sceneTags.includes(n))return toast('已经有这个场景标签');if(S.sceneTags.length>=6)return toast('最多 6 个场景标签，请先删除一个');S.sceneTags.push(n);W.addingTag=false;W.newTag='';save();renderModal()},
  'wz-app'(t){UI.wiz.apps[t.dataset.app]=t.checked;renderModal()},
  'wz-all'(){const W=UI.wiz;const src=PROJ(W.source);const allOn=src.apps.every(e=>W.apps[e.id]!==false);src.apps.forEach(e=>{W.apps[e.id]=!allOn});renderModal()},
  'wz-create'(){const W=UI.wiz,M=UI.modal;const names=parseScenes(W.sceneText);
    if(!W.name.trim()){M.err='请填写项目名称（会显示在左侧二级菜单）。';return renderModal()}if(!W.question.trim()){M.err='请写下研究问题。';return renderModal()}if(!names.length){M.err='请至少填入一个业务场景：点标签左侧的 ＋，或直接输入。';return renderModal()}
    const sceneIds=names.map(n=>{let x=S.scenes.find(y=>y.name===n);if(!x){x={id:'sc'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,desc:''};S.scenes.push(x)}return x.id});
    const apps=wizApps().map(id=>({id,scenes:sceneIds.slice()}));
    const p={id:'p'+Date.now().toString(36),group:W.group.trim()||'未分类',name:W.name.trim(),role:W.role.trim(),question:W.question.trim(),scenes:sceneIds,dims:W.dims.split(/[,，、]/).map(x=>x.trim()).filter(Boolean),apps,refs:[],flags:{},gaps:{},reviews:{},findings:[],history:[],seen:{},created:todayISO()};
    if(W.source){const src=PROJ(W.source);p.origin={from:src.id,note:`由「${src.name}」项目复用 ${apps.length} 个竞品模块${W.reuse?'与同场景记录':''}`}}
    apps.forEach(e=>e.scenes.forEach(sid=>{const r=S.records.filter(x=>x.app===e.id&&x.scene===sid).sort(byDate)[0];if(r&&W.reuse)p.refs.push({rid:r.id,scene:sid,active:true,added:todayISO(),via:W.source||'archive'});else p.gaps[e.id+'|'+sid]=true}));
    S.projects.push(p);save();UI.modal=null;UI.wiz=null;go('project-'+p.id);toast(`已创建「${p.group}-${p.name}」：${apps.length} 款竞品，复用 ${p.refs.length} 条记录，${Object.keys(p.gaps).length} 个场景需补采`)},
  'card-manage'(t){const pid=t.dataset.pid;if(UI.manage[pid])delete UI.manage[pid];else UI.manage[pid]=[];render()},
  'card-pick'(t){const L=UI.manage[t.dataset.pid];const i=L.indexOf(t.dataset.app);if(i>=0)L.splice(i,1);else L.push(t.dataset.app);render()},
  'card-clear'(t){UI.manage[t.dataset.pid]=[];render()},
  'card-del'(t){UI.modal={type:'carddel',pid:t.dataset.pid};renderModal()},
  'card-del-do'(){const p=PROJ(UI.modal.pid);const ids=UI.manage[p.id]||[];
    p.apps=p.apps.filter(e=>!ids.includes(e.id));p.refs=p.refs.filter(f=>{const r=REC(f.rid);return !r||!ids.includes(r.app)});
    [p.gaps,p.flags].forEach(o=>Object.keys(o).forEach(k=>{if(ids.includes(k.split('|')[0]))delete o[k]}));ids.forEach(id=>{if(p.seen)delete p.seen[id]});
    delete UI.manage[p.id];save();UI.modal=null;render();toast(`已从本项目移除 ${ids.length} 个竞品卡片，档案中的 App 与记录仍保留`)},
  'card-new'(t){const p=PROJ(t.dataset.pid);UI.modal={type:'cardnew',pid:p.id,d:{mode:S.apps.some(a=>!p.apps.some(e=>e.id===a.id))?'archive':'new',pick:[],scenes:p.scenes.slice(),reuse:true,name:'',mark:'',platform:'iOS',channel:'App Store',v:'',color:'#5B6B7A'}};renderModal()},
  'cn-mode'(t){UI.modal.d.mode=t.dataset.v;UI.modal.err=null;renderModal()},
  'cn-pick'(t){const L=UI.modal.d.pick;const i=L.indexOf(t.dataset.app);if(i>=0)L.splice(i,1);else L.push(t.dataset.app);renderModal()},
  'cn-scene'(t){const L=UI.modal.d.scenes;const i=L.indexOf(t.dataset.scene);if(i>=0)L.splice(i,1);else L.push(t.dataset.scene);renderModal()},
  'cn-save'(){const M=UI.modal,D=M.d,p=PROJ(M.pid);let ids=[];
    if(!D.scenes.length){M.err='至少选择一个要调查的业务场景。';return renderModal()}
    if(D.mode==='archive'){if(!D.pick.length){M.err='请至少选择一款 App。';return renderModal()}ids=D.pick.slice()}
    else{const n=(D.name||'').trim(),v=(D.v||'').trim();if(!n||!v){M.err='请填写 App 名称和当前商店版本号。';return renderModal()}if(S.apps.some(a=>a.name===n)){M.err='竞品档案中已有同名 App，请改用「从竞品档案选择」。';return renderModal()}
      const a={id:'a'+Date.now().toString(36),name:n,mark:((D.mark||'').trim()||n.replace(/银行$/,'')[0]||n[0]).slice(0,1),color:D.color||'#5B6B7A',platform:D.platform,channel:(D.channel||'').trim(),demo:false,store:[{id:uid('s'),v,d:todayISO(),note:'',src:'手动登记'}]};S.apps.push(a);ids=[a.id]}
    let reused=0,miss=0;ids.forEach(id=>{p.apps.push({id,scenes:D.scenes.slice()});D.scenes.forEach(sid=>{const r=S.records.filter(x=>x.app===id&&x.scene===sid).sort(byDate)[0];if(r&&D.reuse){addRef(p,r.id,sid,'archive');reused++}else{p.gaps[id+'|'+sid]=true;miss++}})});
    save();UI.modal=null;render();toast(`已新建 ${ids.length} 个竞品卡片：复用 ${reused} 条记录，${miss} 个场景需补采`)},
  'rec-edit'(t){const r=REC(t.dataset.rid);UI.modal={type:'record',editId:r.id,d:{app:r.app,scene:r.scene,version:r.version,platform:r.platform,channel:r.channel||'',date:r.date,author:r.author||'研究员',shots:(r.shots||[]).slice(),noChange:!!r.noChange,changes:r.changes||'',feeling:r.feeling||'',cause:r.cause||'',causeSpec:!!r.causeSpec}};renderModal()},
  'rec-del'(t){UI.modal={type:'recdel',rid:t.dataset.rid};renderModal()},
  'rec-del-do'(){const rid=UI.modal.rid;const r=REC(rid);
    S.projects.forEach(p=>{const had=p.refs.filter(f=>f.rid===rid);p.refs=p.refs.filter(f=>f.rid!==rid);delete p.reviews[rid];
      had.forEach(f=>{if(f.active&&!activeRecs(p,r.app,f.scene).filter(x=>x.id!==rid).length)p.gaps[r.app+'|'+f.scene]=true});
      p.findings.forEach(f=>{const i=f.rids.indexOf(rid);if(i>=0){f.rids.splice(i,1);f.removed=(f.removed||0)+1}})});
    S.records=S.records.filter(x=>x.id!==rid);Object.values(UI.ab).forEach(ab=>{[0,1].forEach(i=>{if(ab[i]===rid)ab[i]=undefined})});
    save();UI.modal=null;render();toast('记录已删除，相关项目的引用与状态已更新')},
  reset(){UI.modal={type:'reset'};renderModal()},
  'reset-do'(){S=seedData();save();Object.assign(UI,{filters:{},branch:{},ab:{},archScene:{},editing:{},focus:null,modal:null,wiz:null,scope:{},rescope:{}});go('home');render();toast('已恢复演示数据')},
  close(){UI.modal=null;renderModal()},
  scrim(t,e){if(e.target===t){UI.modal=null;renderModal()}},
};
document.addEventListener('click',e=>{
  if(UI.sideOpen&&!e.target.closest('#side')&&!e.target.closest('[data-act="side"]')){UI.sideOpen=false;document.getElementById('side').classList.remove('open')}
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.dataset.act; if(!ACT[act]) return;
  if(t.tagName==='A') e.preventDefault();
  if(t.classList.contains('ccard')&&e.target.closest('button,a')&&e.target.closest('button,a')!==t) return;
  if(act==='scrim'&&e.target!==t) return;
  ACT[act](t,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&UI.modal){UI.modal=null;renderModal()}
  if(e.key==='Enter'&&e.target.id==='composer'&&!e.shiftKey){e.preventDefault();ACT['compose-create']()}
  if(e.key==='Enter'&&e.target.id==='wz-newtag'){e.preventDefault();ACT['wz-tag-save']()}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('ccard')){e.preventDefault();ACT[e.target.dataset.act](e.target,e)}
});
document.addEventListener('input',e=>{const b=e.target.dataset&&e.target.dataset.bind;if(!b)return;if(e.target.type==='checkbox')return;setPath(b,e.target.value);
  if(b==='wiz.sceneText'){const el=document.getElementById('wz-sum');if(el)el.textContent=wizSummary();const cur=parseScenes(UI.wiz.sceneText);document.querySelectorAll('.stag').forEach((x,i)=>x.classList.toggle('on',cur.includes(S.sceneTags[i])))}});
document.addEventListener('change',e=>{
  const t=e.target,b=t.dataset.bind;
  if(b){setPath(b,t.type==='checkbox'?t.checked:t.value);
    if(b==='modal.d.app'&&UI.modal.type==='record'){const a=APP(t.value);Object.assign(UI.modal.d,{version:storeLatest(a).v,platform:a.platform,channel:a.channel})}
    if(t.dataset.rerender){renderModal();return}}
  const on=t.dataset.on;
  if(on==='files'){addFiles(t.files);return}
  if(on==='cmp-sel'){const ab=UI.ab[t.dataset.app];ab[+t.dataset.i]=t.value;render()}
  if(on==='rs-map'){const D=UI.rescope[t.dataset.pid];if(t.dataset.kind==='map')D.map[t.dataset.rid]=t.value;else{if(t.value)D.add[t.dataset.rid]=t.value;else delete D.add[t.dataset.rid]}render()}
  if(on==='scope-add-app'&&t.value){UI.scope[t.dataset.pid].apps.push({id:t.value,scenes:UI.scope[t.dataset.pid].scenes.slice()});render()}
  if(on==='scope-import'&&t.value){const D=UI.scope[t.dataset.pid];const src=PROJ(t.value);let n=0;src.apps.forEach(e=>{if(!D.apps.some(x=>x.id===e.id)){D.apps.push({id:e.id,scenes:D.scenes.slice()});n++}});render();toast(n?`已从「${src.name}」导入 ${n} 个竞品模块`:'这些竞品已在项目中')}
});
document.addEventListener('paste',e=>{if(UI.modal&&UI.modal.type==='record'){const fs=[...(e.clipboardData||{}).files||[]];if(fs.length){e.preventDefault();addFiles(fs)}}});

load(); render();

</script>

</body></html>
